<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partizan Sesi</title>
<meta name="description" content="Sol ve sosyalist basından değerlendirme yazıları ve gündem.">
<meta property="og:site_name" content="Partizan Sesi">
<meta property="og:title" content="Partizan Sesi">
<meta property="og:description" content="Sol ve sosyalist basından değerlendirme yazıları ve gündem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="ortak.js"></script>
<style>.metin h2.ara{font-size:23px;margin:34px 0 8px}.metin h3.alt{font:900 13px -apple-system,Arial,sans-serif;letter-spacing:1.2px;color:var(--kirmizi);text-transform:uppercase;margin:28px 0 6px}.metin blockquote{border-left:3px solid var(--kirmizi);margin:18px 0;padding-left:14px;font-style:italic;opacity:.85}.metin ul{padding-left:22px}.metin .ayrac{text-align:center;letter-spacing:6px;opacity:.6}</style>
<!-- pwa-kur -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Partizan Sesi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EFE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
</head>
<body>
<header id="ust"></header>
<main id="m"><div class="uyari">…</div></main>
<footer id="alt"></footer>
<script>
ustKisim('');
const m = document.getElementById('m');
(async () => {
  const id = qp.get('id');
  const yok = () => m.innerHTML = `<div class="uyari">${t('Yazı bulunamadı ya da yayından kaldırılmış.')}</div>`;
  if (!id) return yok();
  const { data: a } = await sb.from('articles').select(SELECT).eq('id', id).eq('status','published').maybeSingle();
  if (!a) return yok();
  let yazar = '';
  if (a.yazar_id) { const { data: y } = await sb.from('yazarlar').select('name').eq('id', a.yazar_id).maybeSingle(); yazar = y?.name || ''; }
  const src = a.article_sources?.[0] || {};
  let govde = String(a.body || '').trim(), ozet = String(a.excerpt || '').trim();
  if (ozet && govde.startsWith(ozet) && govde.slice(ozet.length).trim()) govde = govde.slice(ozet.length).trim();
  const ozt = ozetBasliksiz(a.title, ozet), so = sade(ozt), sm = sade(govde);
  const kel = x => String(x || '').toLocaleLowerCase('tr').split(/[^a-z0-9\u00c0-\u024f]+/).filter(w => w.length >= 4).map(w => w.slice(0, 5));
  const ok = kel(ozt), bas = new Set(kel(govde).slice(0, Math.max(20, Math.min(120, ok.length * 2))));
  const benzer = ok.length >= 6 && ok.filter(w => bas.has(w)).length / ok.length >= 0.55;
  const ozetGoster = so.length >= 40 && !benzer && !sm.startsWith(so.slice(0, Math.min(so.length - 5, 160)));
  const bolum = a.categories?.name && a.categories.name !== 'YAZARLAR' ? a.categories.name : '';
  document.title = a.title + ' – Partizan Sesi';
  const satirIci = x => esc(x)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" rel="noopener">$1</a>')
    .replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w*])\*([^*\s](?:[^*\n]*?[^*\s])?)\*(?![\w*])/g, '$1<em>$2</em>')
    .replace(/\n/g, '<br>');
  function bicimle(b) {
    const s = b.split('\n');
    if (b.startsWith('## ')) return '<h2 class="ara">' + esc(b.slice(3)) + '</h2>';
    if (b.startsWith('### ')) return '<h3 class="alt">' + esc(b.slice(4)) + '</h3>';
    if (s.every(x => x.startsWith('>'))) return '<blockquote>' + satirIci(s.map(x => x.replace(/^>\s?/, '')).join('\n')) + '</blockquote>';
    if (s.every(x => x.startsWith('• '))) return '<ul>' + s.map(x => '<li>' + satirIci(x.slice(2)) + '</li>').join('') + '</ul>';
    if (/^(\*\s*){3,}$/.test(b)) return '<p class="ayrac">* * *</p>';
    return '<p>' + satirIci(b) + '</p>';
  }
  const paras = govde.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(bicimle).join('');
  m.innerHTML = `<article class="yazi">
    ${a.media?.public_url ? `<img class="kapak" src="${esc(a.media.public_url)}" alt="">` : ''}
    ${bolum ? `<div class="bolum">${esc(t(bolum))}</div>` : '<div style="height:22px"></div>'}
    <h1>${esc(a.title)}</h1>
    <div class="meta">${esc(yazar || kaynakAdi(a))} · ${tarih(a.published_at)}</div>
    ${ozetGoster ? `<div class="giris">${esc(ozt)}</div>` : ''}
    <div class="metin">${paras}</div>
    ${src.source_url ? `<div class="kaynak">${t('Kaynak')}: <a href="${esc(src.source_url)}" rel="noopener">${esc(kaynakAdi(a))} ↗</a></div>` : ''}</article>`;
})();
</script></body></html>
