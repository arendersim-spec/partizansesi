<body>
<header id="ust"></header>
<main id="m"><div class="uyari">…</div></main>
<footer id="alt"></footer>
<script>
ustKisim('gundem');
const m = document.getElementById('m');
(async () => {
  m.innerHTML = `<div class="uyari">${t('Yükleniyor…')}</div>`;
  const yz = await yazarAdlari();
  let rows = [];
  if (DIL === 'tr') {
    const { data: ids } = await sb.rpc('gundem_ids', { p_bolum: null, p_adet: 90 });
    const liste = (ids || []).map(e => typeof e === 'object' ? Object.values(e)[0] : e);
    if (liste.length) { const { data } = await sb.from('articles').select(SELECT).eq('status','published').eq('dil','tr').in('id', liste); rows = data || []; }
  } else {
    const { data } = await sb.from('articles').select(SELECT).eq('status','published').eq('dil', DIL).order('published_at', { ascending: false }).limit(60);
    rows = data || [];
  }
  rows.sort((a, b) => String(b.published_at).localeCompare(String(a.published_at)));
  m.innerHTML = `<div class="baslik"><h2>${t('GÜNDEM')}</h2></div>` +
    (rows.length ? `<div class="izgara">${rows.map(a => kart(a, yz.ad)).join('')}</div>` : `<div class="uyari">${t('Bu bölümde henüz yazı yok.')}</div>`);
})();
</script></body></html>
