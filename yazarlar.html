<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yazarlar – Partizan Sesi</title>
<meta name="description" content="Sol ve sosyalist basından değerlendirme yazıları ve gündem.">
<meta property="og:site_name" content="Partizan Sesi">
<meta property="og:title" content="Yazarlar – Partizan Sesi">
<meta property="og:description" content="Sol ve sosyalist basından değerlendirme yazıları ve gündem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="ortak.js"></script>
</head>
<body>
<header id="ust"></header>
<main id="m"><div class="uyari">…</div></main>
<footer id="alt"></footer>
<script>
ustKisim('yazarlar');
const m = document.getElementById('m');
(async () => {
  m.innerHTML = `<div class="uyari">${t('Yükleniyor…')}</div>`;
  const yz = await yazarAdlari();
  const sec = qp.get('y');
  const yuz = y => `<div class="yuz">${y.photo_url ? `<img src="${esc(y.photo_url)}" alt="">` : esc(y.name.split(' ').map(p => p[0]).slice(0,2).join(''))}</div>`;
  if (!sec) {
    m.innerHTML = `<div class="baslik"><h2>${t('YAZARLAR')}</h2></div><div class="yazarlar" style="flex-wrap:wrap">` +
      yz.liste.map(y => `<a class="yazar" href="yazarlar.html?y=${y.id}">${yuz(y)}${esc(y.name)}</a>`).join('') + '</div>';
    return;
  }
  const y = yz.liste.find(x => String(x.id) === sec);
  const { data } = await sb.from('articles').select(SELECT).eq('status','published').eq('yazar_id', sec).eq('dil', DIL).order('published_at', { ascending: false }).limit(150);
  const rows = data || [];
  document.title = (y?.name || '') + ' – Partizan Sesi';
  m.innerHTML = `<div class="baslik"><h2>${esc(y?.name || '')}</h2><a href="yazarlar.html">${t('YAZARLAR')}</a></div>` +
    (rows.length ? `<div class="izgara">${rows.map(a => kart(a, yz.ad)).join('')}</div>` : `<div class="uyari">${t('Bu bölümde henüz yazı yok.')}</div>`);
})();
</script></body></html>
