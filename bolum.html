<script>
const b = qp.get('b') || 'KURAM';
ustKisim(b);
const m = document.getElementById('m');
(async () => {
  m.innerHTML = `<div class="uyari">${t('Yükleniyor…')}</div>`;
  document.title = t(b) + ' – Partizan Sesi';
  const yz = await yazarAdlari();
  const { data } = await sb.from('articles').select(SELECT.replace('categories!articles_primary_category_id_fkey(name)', 'categories!articles_primary_category_id_fkey!inner(name)'))
    .eq('status','published').eq('dil', DIL).eq('categories.name', b).order('published_at', { ascending: false }).limit(60);
  const rows = data || [];
  m.innerHTML = `<div class="baslik"><h2>${esc(t(b))}</h2></div>` +
    (rows.length ? `<div class="izgara">${rows.map(a => kart(a, yz.ad)).join('')}</div>` : `<div class="uyari">${t('Bu bölümde henüz yazı yok.')}</div>`);
})();
