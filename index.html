<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partizan Sesi</title>
<meta name="description" content="Sol ve sosyalist basından değerlendirme yazıları ve gündem.">
<meta property="og:site_name" content="Partizan Sesi">
<meta property="og:title" content="Partizan Sesi">
<meta property="og:description" content="Sol ve sosyalist basından değerlendirme yazıları ve gündem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="ortak.js"></script>
</head>
<body>
<header id="ust"></header>
<main id="m"><div class="uyari">…</div></main>
<footer id="alt"></footer>
<script>
ustKisim('ana');
const m = document.getElementById('m');
(async () => {
  m.innerHTML = `<div class="uyari">${t('Yükleniyor…')}</div>`;
  const yz = await yazarAdlari();
  let rows = [];
  if (DIL === 'tr') {
    const { data: ids } = await sb.rpc('ana_sayfa_ids');
    const liste = (ids || []).map(e => typeof e === 'object' ? Object.values(e)[0] : e);
    if (liste.length) { const { data } = await sb.from('articles').select(SELECT).eq('status','published').in('id', liste); rows = data || []; }
  } else {
    const { data } = await sb.from('articles').select(SELECT).eq('status','published').eq('dil', DIL).order('published_at', { ascending: false }).limit(80);
    rows = data || [];
  }
  rows.sort((a, b) => (b.featured === true) - (a.featured === true) || String(b.published_at).localeCompare(String(a.published_at)));
  if (!rows.length) { m.innerHTML = `<div class="uyari">${t('Bu bölümde henüz yazı yok.')}</div>`; return; }
  const one = rows.find(r => r.featured && gorsel(r)) || rows.find(r => gorsel(r)) || rows[0];
  const bol = r => r.categories?.name || '';
  let h = `<div class="baslik"><h2>${t('ÖNE ÇIKANLAR')}</h2></div>
    <a class="one" href="yazi.html?id=${one.id}">${gorsel(one) ? `<img src="${esc(one.media.public_url || gorsel(one))}" alt="">` : '<div style="height:220px"></div>'}
    <div>${bol(one) && bol(one) !== 'YAZARLAR' ? `<span class="etiket">${esc(t(bol(one)))}</span>` : ''}<h1>${esc(one.title)}</h1>
    <div class="km" style="color:#ddd">${esc((one.yazar_id && yz.ad[one.yazar_id]) || kaynakAdi(one))} · ${okuma(one)}</div></div></a>`;
  if (yz.liste.length && DIL === 'tr') {
    h += `<div class="baslik"><h2>${t('YAZARLAR')}</h2><a href="yazarlar.html">${t('TÜMÜ →')}</a></div><div class="yazarlar">` +
      yz.liste.map(y => `<a class="yazar" href="yazarlar.html?y=${y.id}"><div class="yuz">${y.photo_url ? `<img src="${esc(y.photo_url)}" alt="">` : esc(y.name.split(' ').map(p => p[0]).slice(0,2).join(''))}</div>${esc(y.name)}</a>`).join('') + '</div>';
  }
  for (const b of SIRA) {
    const list = rows.filter(r => bol(r) === b && r.id !== one.id).slice(0, 3);
    if (!list.length) continue;
    h += `<div class="baslik"><h2>${esc(t(b))}</h2><a href="bolum.html?b=${encodeURIComponent(b)}">${t('TÜMÜ →')}</a></div><div class="izgara">${list.map(a => kart(a, yz.ad)).join('')}</div>`;
  }
  m.innerHTML = h;
})();
</script></body></html>
